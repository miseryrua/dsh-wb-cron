<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="492" viewBox="0 0 1200 492"
     role="img" aria-labelledby="path-title path-desc">
  <title id="path-title">dsh-wb-cron 开火路径与 Agent 预设三级降级链</title>
  <desc id="path-desc">上半部分为每次到点时的开火路径五步：tick 判定墙钟到点、解析预设、agents.create 挂载、followup 注入任务指令、whenIdle 后 flush 落盘。下半部分为预设不可用时的三级降级阶梯：任务钉的 preset 失败后依次退到 standard、全局默认预设、最后裸上下文执行，每一级失败都写进运行历史的 error 字段。</desc>

  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace; }
    </style>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#3d4753"/>
    </marker>
  </defs>

  <rect width="1200" height="492" rx="20" fill="#0b0d10"/>
  <rect x="0.5" y="0.5" width="1199" height="491" rx="20" fill="none" stroke="#232a33"/>

  <!-- ══════════════ 上：开火路径 ══════════════ -->
  <g>
    <text x="56" y="52" class="sans" font-size="26" font-weight="600" fill="#eef2f7">开火路径</text>
    <text x="192" y="52" class="mono" font-size="18" fill="#7c8899">每次到点 · 进程内</text>

    <!-- 五步 -->
    <g>
      <rect x="56" y="78" width="195" height="88" rx="12" fill="#12151a" stroke="#28313c"/>
      <text x="70" y="116" class="sans" font-size="21" fill="#eef2f7">到点触发</text>
      <text x="70" y="144" class="mono" font-size="18" fill="#7c8899">tick 每 30s 判定</text>
    </g>
    <path d="M 255 122 L 273 122" stroke="#3d4753" stroke-width="1.5" marker-end="url(#arw)"/>
    <g>
      <rect x="279" y="78" width="195" height="88" rx="12" fill="#12151a" stroke="#28313c"/>
      <text x="293" y="116" class="sans" font-size="21" fill="#eef2f7">解析预设</text>
      <text x="293" y="144" class="mono" font-size="18" fill="#7c8899">三级降级兜底</text>
    </g>
    <path d="M 478 122 L 496 122" stroke="#3d4753" stroke-width="1.5" marker-end="url(#arw)"/>
    <g>
      <rect x="502" y="78" width="195" height="88" rx="12" fill="#12151a" stroke="#2563eb"/>
      <text x="516" y="108" class="mono" font-size="18" fill="#eef2f7">agents.create</text>
      <text x="516" y="134" class="sans" font-size="18" fill="#c2ccd8">meta + setup</text>
      <text x="516" y="155" class="mono" font-size="18" fill="#7c8899">cwd / 模型 / 预设</text>
    </g>
    <path d="M 701 122 L 719 122" stroke="#3d4753" stroke-width="1.5" marker-end="url(#arw)"/>
    <g>
      <rect x="725" y="78" width="195" height="88" rx="12" fill="#12151a" stroke="#28313c"/>
      <text x="739" y="116" class="mono" font-size="18" fill="#eef2f7">followup</text>
      <text x="739" y="144" class="mono" font-size="18" fill="#7c8899">注入任务指令</text>
    </g>
    <path d="M 924 122 L 942 122" stroke="#3d4753" stroke-width="1.5" marker-end="url(#arw)"/>
    <g>
      <rect x="948" y="78" width="195" height="88" rx="12" fill="#12151a" stroke="#28313c"/>
      <text x="962" y="110" class="mono" font-size="18" fill="#eef2f7">whenIdle</text>
      <text x="962" y="134" class="mono" font-size="18" fill="#eef2f7">→ flush</text>
      <text x="962" y="155" class="mono" font-size="18" fill="#7c8899">会话落盘可续聊</text>
    </g>

    <text x="56" y="192" class="mono" font-size="18" fill="#6f7a88">配方逐行对齐 @deepseek-ai/dsh-headless 的 run()</text>
    <text x="56" y="216" class="mono" font-size="18" fill="#6f7a88">agent 活在 web profile 进程内，天然继承该 profile 的模型路由、记忆注入、skills、hooks</text>
  </g>

  <line x1="56" y1="242" x2="1144" y2="242" stroke="#1c2229" stroke-width="1"/>

  <!-- ══════════════ 下：预设降级阶梯 ══════════════ -->
  <g>
    <text x="56" y="266" class="sans" font-size="26" font-weight="600" fill="#eef2f7">预设不可用时 · 三级降级</text>
    <text x="360" y="266" class="mono" font-size="18" fill="#7c8899">不中断任务</text>

    <g transform="translate(56 292)">
      <rect width="252" height="46" rx="10" fill="#12151a" stroke="#2563eb"/>
      <circle cx="22" cy="23" r="11" fill="#2563eb"/>
      <text x="22" y="29" class="mono" font-size="14" fill="#0b0d10" text-anchor="middle">0</text>
      <text x="44" y="30" class="sans" font-size="19" fill="#eef2f7">任务钉的 preset</text>
    </g>
    <path d="M 308 315 L 318 315 L 318 345 L 330 345" fill="none" stroke="#3d4753" stroke-width="1.5" marker-end="url(#arw)"/>

    <g transform="translate(340 322)">
      <rect width="252" height="46" rx="10" fill="#12151a" stroke="#28313c"/>
      <circle cx="22" cy="23" r="11" fill="#39424e"/>
      <text x="22" y="29" class="mono" font-size="14" fill="#c2ccd8" text-anchor="middle">1</text>
      <text x="44" y="30" class="sans" font-size="19" fill="#eef2f7">standard 标准模式</text>
    </g>
    <path d="M 592 345 L 602 345 L 602 375 L 614 375" fill="none" stroke="#3d4753" stroke-width="1.5" marker-end="url(#arw)"/>

    <g transform="translate(624 352)">
      <rect width="252" height="46" rx="10" fill="#12151a" stroke="#28313c"/>
      <circle cx="22" cy="23" r="11" fill="#39424e"/>
      <text x="22" y="29" class="mono" font-size="14" fill="#c2ccd8" text-anchor="middle">2</text>
      <text x="44" y="30" class="sans" font-size="19" fill="#eef2f7">全局默认预设</text>
    </g>
    <path d="M 876 375 L 886 375 L 886 405 L 898 405" fill="none" stroke="#3d4753" stroke-width="1.5" marker-end="url(#arw)"/>

    <g transform="translate(908 382)">
      <rect width="236" height="46" rx="10" fill="#12151a" stroke="#28313c"/>
      <circle cx="22" cy="23" r="11" fill="#39424e"/>
      <text x="22" y="29" class="mono" font-size="14" fill="#c2ccd8" text-anchor="middle">3</text>
      <text x="44" y="30" class="sans" font-size="19" fill="#eef2f7">裸上下文执行</text>
    </g>
  </g>

  <text x="56" y="452" class="sans" font-size="18" fill="#7c8899">每一级失败都写进该次运行历史的 error 字段，status 仍按实际执行结果记。</text>
  <text x="56" y="478" class="sans" font-size="18" fill="#7c8899">定时任务无人值守，中断代价高于偏差。</text>
</svg>
